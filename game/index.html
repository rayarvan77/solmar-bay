<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>Solmar Bay — Make GTA 6</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #10141a; font-family: "Segoe UI", system-ui, sans-serif; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; z-index: 5; }
  #hud-top-left { position: absolute; top: 14px; left: 16px; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  .hud-label { font-size: 11px; letter-spacing: 2px; opacity: .85; margin-right: 8px; }
  #health-bar { display: inline-block; width: 170px; height: 12px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.5); vertical-align: middle; }
  #health-fill { height: 100%; width: 100%; background: #4caf50; transition: width .2s; }
  #money-row { margin-top: 6px; font-size: 22px; font-weight: 700; }
  #objective { margin-top: 8px; max-width: 430px; font-size: 14px; line-height: 1.35; background: rgba(0,0,0,.45); padding: 6px 9px; border-left: 3px solid #ffc020; }
  #hud-top-right { position: absolute; top: 14px; right: 16px; text-align: right; text-shadow: 0 1px 3px rgba(0,0,0,.8); }
  #wanted { font-size: 26px; letter-spacing: 3px; color: #ffd75e; }
  #wanted.warm { color: #ff9a3d; }
  #wanted.hot { color: #ff4d3d; }
  #clock { font-size: 14px; opacity: .9; margin-top: 2px; }
  #speedo { position: absolute; bottom: 18px; left: 20px; font-size: 30px; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,.85); display: none; }
  #minimap { position: absolute; right: 16px; bottom: 16px; border: 2px solid rgba(255,255,255,.55); border-radius: 4px; background: #10141a; }
  #toasts { position: absolute; left: 16px; bottom: 70px; max-width: 420px; }
  .toast { background: rgba(0,0,0,.6); border-left: 3px solid #4a86ff; padding: 7px 10px; margin-top: 6px; font-size: 13.5px; line-height: 1.35; transition: opacity .4s; }
  .toast.fade { opacity: 0; }
  #center-msg { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); font-size: 26px; font-weight: 800; letter-spacing: 1px; text-align: center; text-shadow: 0 2px 8px rgba(0,0,0,.9); opacity: 0; transition: opacity .3s; max-width: 80%; }
  #center-msg.show { opacity: 1; }
  #start-screen, #end-screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(8,12,20,.72); pointer-events: auto; text-align: center; }
  #start-screen h1, #end-screen h1 { font-size: 64px; margin: 0; letter-spacing: 6px; color: #ffc020; text-shadow: 0 4px 18px rgba(0,0,0,.8); }
  #end-screen h1 { color: #ff4d3d; }
  #start-screen .tagline { font-size: 18px; margin: 10px 0 4px; }
  #start-screen p, #end-screen p { font-size: 15px; margin: 6px 0; }
  #start-screen .controls { font-size: 13px; opacity: .85; margin-top: 14px; }
  #start-screen .fine { font-size: 12px; opacity: .7; }
  #start-screen button, #end-screen button { pointer-events: auto; margin-top: 22px; font-size: 18px; font-weight: 700; letter-spacing: 2px; padding: 12px 34px; border: none; border-radius: 4px; background: #ffc020; color: #1a1405; cursor: pointer; }
  #start-screen button:hover, #end-screen button:hover { background: #ffd75e; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="game"></div>
<div id="hud"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
